name: Feature request
description: Propose a generalizable mission, evidence, or adapter improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: outcome
    attributes:
      label: User outcome
      description: What should become possible or safer?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance criteria
      description: How could an independent gate prove this works?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
