name: Bug report
description: Report a reproducible protocol, runner, gate, or documentation problem.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Long Mission version
      placeholder: v1.0.11
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest red-capable command or mission fixture. Redact secrets.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paste relevant gate output, feedback, screenshots, or logs.
    validations:
      required: true
